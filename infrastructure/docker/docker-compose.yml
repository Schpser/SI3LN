version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: si3ln
      POSTGRES_USER: si3ln_user
      POSTGRES_PASSWORD: si3ln_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ../../backend_api_python
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgres://si3ln_user:si3ln_pass@postgres:5432/si3ln
    volumes:
      - ../../backend_api_python:/app

  frontend:
    build: ../../web_dashboard
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
