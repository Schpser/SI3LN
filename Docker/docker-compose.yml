services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: si3ln-db
    environment:
      POSTGRES_DB: si3ln_db
      POSTGRES_USER: si3ln_user
      POSTGRES_PASSWORD: si3ln_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U si3ln_user -d si3ln_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - si3ln-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: si3ln-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - si3ln-network

  # Django API Backend
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: si3ln-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ../api/media:/app/media
      - ../api/staticfiles:/app/staticfiles
    environment:
      - DJANGO_SETTINGS_MODULE=si3ln_api.settings
      - PYTHONUNBUFFERED=1
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,api,frontend
      - DATABASE_URL=postgresql://si3ln_user:si3ln_password@db:5432/si3ln_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-docker-secret-key-change-in-production
      - JWT_SECRET_KEY=dev-jwt-secret-change-in-production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/game/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - si3ln-network

  # Frontend Web Dashboard
  frontend:
    build:
      context: ../web_dashboard
      dockerfile: Dockerfile
    container_name: si3ln-frontend
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      # Mount the compiled Wasm game files so nginx can serve /game/game.*
      - game_wasm:/usr/share/nginx/html/game/wasm:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - si3ln-network

  # ─── C++ Game → WebAssembly builder (run once with: docker-compose --profile game up game-builder) ───
  # After building, files are stored in the 'game_wasm' volume and served by nginx.
  # Re-run only when you change the C++ source.
  game-builder:
    build:
      context: ../game_engine_C++
      dockerfile: Dockerfile.wasm
    container_name: si3ln-game-builder
    profiles:
      - game
    volumes:
      - game_wasm:/output
    restart: "no"

# Networks
networks:
  si3ln-network:
    driver: bridge

# Volumes for persistent data
volumes:
  postgres_data:
  redis_data:
  game_wasm:    # Stores compiled Wasm files, shared between game-builder and frontend
