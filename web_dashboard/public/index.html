<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SI3LN Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 SI3LN - Dashboard</h1>
            <p>Fullstack gaming platform</p>
        </header>
        
        <section class="dashboard">
            <div class="card">
                <h2>🏆 Leaderboard</h2>
                <div id="leaderboard">Loading...</div>
            </div>
            
            <div class="card">
                <h2>👤 Player Profile</h2>
                <div id="profile">Please log in</div>
            </div>
            
            <div class="card">
                <h2>🎮 Game Status</h2>
                <p>API: <span id="api-status">Not connected</span></p>
                <p>Database: <span id="db-status">Unknown</span></p>
            </div>
        </section>
        
        <footer>
            <p>FullStack Project by hugou74130 & Schpser - Web & Mobile Web Developer</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
