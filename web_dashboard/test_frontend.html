<!DOCTYPE html>
<html>
<head>
    <title>SI3LN Game Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        #gameContainer {
            position: relative;
        }
        canvas {
            border: 2px solid #00ff00;
            display: block;
        }
        #info {
            color: #00ff00;
            margin-top: 10px;
            text-align: center;
        }
        #controls {
            color: #00ff00;
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1024" height="768"></canvas>
        <div id="info">
            <div>Lives: <span id="lives">3</span> | Score: <span id="score">0</span></div>
            <div id="status">Loading assets...</div>
        </div>
        <div id="controls">
            Controls: Arrow Keys / WASD = Move | Space = Shoot
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const images = {};
        
        // Game state from C++ (simulated for now)
        let gameState = {
            player: { x: 512, y: 668, width: 80, height: 60, asset: 'assets/players/1000055338.png' },
            enemies: [
                { x: 100, y: 100, width: 60, height: 60, asset: 'assets/enemies/Space_world/7f7ae73f6e4e86f62e5f17ec1c36c88b.png' },
                { x: 300, y: 150, width: 60, height: 60, asset: 'assets/enemies/Space_world/7f7ae73f6e4e86f62e5f17ec1c36c88b.png' },
                { x: 500, y: 100, width: 60, height: 60, asset: 'assets/enemies/Space_world/7f7ae73f6e4e86f62e5f17ec1c36c88b.png' }
            ],
            bullets: [],
            background: 'assets/worlds/background_space.jpg'
        };

        let keys = {};
        
        // Load image helper
        function loadImage(path) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    images[path] = img;
                    resolve();
                };
                img.onerror = () => {
                    console.error('Failed to load:', path);
                    reject();
                };
                img.src = path;
            });
        }

        // Preload assets
        async function preloadAssets() {
            const assetsToLoad = [
                gameState.background,
                gameState.player.asset,
                ...gameState.enemies.map(e => e.asset)
            ];

            document.getElementById('status').textContent = 'Loading assets...';
            
            try {
                await Promise.all(assetsToLoad.map(path => loadImage(path)));
                document.getElementById('status').textContent = 'Ready! Use Arrow Keys to move, Space to shoot';
                return true;
            } catch (error) {
                document.getElementById('status').textContent = 'Error loading assets. Check console.';
                return false;
            }
        }

        // Render function
        function render() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw background
            if (images[gameState.background]) {
                ctx.drawImage(images[gameState.background], 0, 0, canvas.width, canvas.height);
            }

            // Draw enemies
            gameState.enemies.forEach(enemy => {
                if (images[enemy.asset]) {
                    ctx.drawImage(
                        images[enemy.asset],
                        enemy.x - enemy.width / 2,
                        enemy.y - enemy.height / 2,
                        enemy.width,
                        enemy.height
                    );
                }
            });

            // Draw bullets
            gameState.bullets.forEach(bullet => {
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(bullet.x - 2, bullet.y - 5, 4, 10);
            });

            // Draw player
            if (images[gameState.player.asset]) {
                ctx.drawImage(
                    images[gameState.player.asset],
                    gameState.player.x - gameState.player.width / 2,
                    gameState.player.y - gameState.player.height / 2,
                    gameState.player.width,
                    gameState.player.height
                );
            }
        }

        // Simple game loop (will be replaced by C++ data later)
        function gameLoop() {
            // Simple player movement (replace with C++ API calls)
            if (keys['ArrowLeft'] || keys['a']) gameState.player.x -= 5;
            if (keys['ArrowRight'] || keys['d']) gameState.player.x += 5;
            if (keys['ArrowUp'] || keys['w']) gameState.player.y -= 5;
            if (keys['ArrowDown'] || keys['s']) gameState.player.y += 5;

            // Clamp player position
            gameState.player.x = Math.max(40, Math.min(984, gameState.player.x));
            gameState.player.y = Math.max(30, Math.min(738, gameState.player.y));

            // Update bullets
            gameState.bullets = gameState.bullets.filter(b => {
                b.y -= 10;
                return b.y > 0;
            });

            // Simple enemy movement
            gameState.enemies.forEach(enemy => {
                enemy.x += Math.sin(Date.now() / 1000 + enemy.x) * 2;
                enemy.y += 0.5;
                if (enemy.y > canvas.height) enemy.y = -50;
            });

            render();
            requestAnimationFrame(gameLoop);
        }

        // Keyboard handling
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            if (e.key === ' ') {
                e.preventDefault();
                // Shoot bullet
                gameState.bullets.push({
                    x: gameState.player.x,
                    y: gameState.player.y - 30
                });
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Initialize
        preloadAssets().then(success => {
            if (success) {
                console.log('Assets loaded successfully!');
                gameLoop();
            }
        });
    </script>
</body>
</html>
